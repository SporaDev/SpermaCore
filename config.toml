# spermacore v1.9.0 - minimal config

[core]
data_dir = "./data"
log_level = "info"
workers = 4
db_key = "${SPERMACORE_DB_KEY}"

[llm]
provider = "openrouter"
model = "google/gemma-4-26b-a4b-it:free"

[llm.providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key = "${OPENROUTER_API_KEY}"
timeout_seconds = 60

[webui]
enabled = true
bind = "127.0.0.1"
port = 8080
auth_token = "${SPERMACORE_WEBUI_TOKEN}"

[bypass]
tgwsproxy = true

[bypasses]
enabled = true
tgwsproxy = true

[plugins]
load = [
  "sysprompt",
  "react",
  "usersc",
  "telegram",
  "embedsc",
  "time",
  "websearch",
  "agentloop",
  "media",
  "dashboard",
  "grouper",
  "bypasses",
]

[plugins.bypasses]
enabled = true
tgwsproxy = true

[plugins.telegram]
enabled = true
api_id = 33558968
api_hash = "${SPERMACORE_TELEGRAM_API_HASH}"
phone = "${SPERMACORE_TELEGRAM_PHONE}"
login_mode = "qr"
reply_to = true
device_model = "iPhone 16 Pro"
app_version = "13.1.1"
database_encryption_key = "${SPERMACORE_TELEGRAM_DB_KEY}"

[plugins.agentloop]
enabled = true
friends = []
interval_min = 15
active_hours_start = 9
active_hours_end = 23
max_per_day = 10

[memory]
enabled = true
embedding_model = "liquid/lfm-2.5-embedding-350m:free"
max_rag_results = 5
similarity_threshold = 0.72
index_type = "hnsw"
hnsw_m = 16
hnsw_ef_construction = 64
hnsw_ef_search = 32

[humanify]
enabled = true
delay_min_ms = 1200
delay_max_ms = 3500
typo_chance_percent = 40
auto_fix_typo = true
distraction_chance = 0.08
distraction_max_ms = 6000
reply_probability = 0.35
split_long = true
split_parts = 3
split_pause_ms = 2200
split_threshold = 200
typing_jitter = 0.3
typo_max = 1

[groups]
enabled = true
reply_chance = 0.06
cooldown_seconds = 45
active_phrases_file = "data/active-phrases.json"
bot_usernames = []
engagement_window_seconds = 4
followup_window_seconds = 180
max_replies_per_hour = 8
min_ambient_chars = 8
priority1_chance = 0.12
priority2_chance = 0.55
priority3_always_reply = true



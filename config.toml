# spermacore v1.9.0 - minimal production config

[core]
data_dir = "./data"
log_level = "info"
workers = 4
db_key = "${SPERMACORE_DB_KEY}"

[llm]
provider = "openrouter"
model = "z-ai/glm-5.3-flash"
vision_model = "google/gemini-2.0-flash"

[llm.routing.vision]
provider = "openrouter"
model = "google/gemini-2.0-flash"

[llm.providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key = "${OPENROUTER_API_KEY}"
timeout_seconds = 60

[webui]
enabled = true
bind = "127.0.0.1"
port = 8080
auth_token = "${SPERMACORE_WEBUI_TOKEN}"

[bypass]
tgwsproxy = true

[bypasses]
enabled = true
tgwsproxy = true

[plugins]
load = [
  "sysprompt",
  "react",
  "usersc",
  "telegram",
  "embedsc",
  "time",
  "websearch",
  "agentloop",
  "media",
  "dashboard",
  "grouper",
  "moderation"
]

[plugins.bypasses]
enabled = true
tgwsproxy = true

[plugins.telegram]
enabled = true
api_id = "${SPERMACORE_TELEGRAM_API_ID}"
api_hash = "${SPERMACORE_TELEGRAM_API_HASH}"
phone = "${SPERMACORE_TELEGRAM_PHONE}"
login_mode = "qr"
reply_to = true
device_model = "Desktop"
app_version = "1.0.0"
database_encryption_key = "${SPERMACORE_TELEGRAM_DB_KEY}"

[plugins.agentloop]
enabled = true
friends = []
interval_min = 15
active_hours_start = 9
active_hours_end = 23
max_per_day = 10

[memory]
enabled = true
embedding_model = "google/gemini-embedding-2"
max_rag_results = 5
similarity_threshold = 0.72
index_type = "hnsw"
hnsw_m = 16
hnsw_ef_construction = 64
hnsw_ef_search = 32

[humanify]
enabled = true
delay_min_ms = 1000
delay_max_ms = 3000
typo_chance_percent = 30
auto_fix_typo = true
distraction_chance = 0.05
distraction_max_ms = 4000
reply_probability = 0.35
split_long = true
split_parts = 3
split_pause_ms = 2000
split_threshold = 200
typing_jitter = 0.3
typo_max = 1

[groups]
enabled = true
reply_chance = 0.06
cooldown_seconds = 45
active_phrases_file = "data/active-phrases.json"
bot_usernames = []
engagement_window_seconds = 4
followup_window_seconds = 180
max_replies_per_hour = 8
min_ambient_chars = 8
priority1_chance = 0.12
priority2_chance = 0.55
priority3_always_reply = true

[context]
enabled = true
max_age_minutes = 360
max_chars = 240
recent_messages = 12

[grouper]
enabled = true
grouper_time = "1.5s"
groups_only = false
joiner = "\n"
max_wait_ms = 10000
window_ms = 1500
